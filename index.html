    <!-- 58 y 155 caracteres: por encima de ~60 y ~160 Google corta en mitad
         de frase y lo que se pierde es siempre el final. "Talca" va en el
         título porque es la búsqueda que trae clientes al local. -->

    <!-- OJO, DECISIÓN PENDIENTE: el cliente ya tiene motorock.cl con este
         MISMO catálogo. Si esta web se indexa a la vez, las dos compiten
         por las mismas búsquedas y Google reparte la fuerza entre ambas.
         Mientras esto sea una propuesta y no el sitio definitivo, el
         canonical apunta al sitio oficial del cliente para no restarle
         posiciones. Cuando reemplace a motorock.cl, cambiar esta línea a
         la URL propia. -->
